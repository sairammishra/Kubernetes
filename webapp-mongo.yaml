apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: my-webapp
    type: front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-webapp
  template:
    metadata: 
      name: webapp-deployment
      labels:
        app: my-webapp
        labels: front
    spec:
      containers:
      -  name: webbapp
         image: nanajanashia/k8s-demo-app:v1.0
         ports:
         -  containerPort: 3000
         env:
         -  name: USER_NAME
            valueFrom:
              secretKeyRef:
                name: monog-secret
                key: mongo-user
         -  name: USER_PWD
            valueFrom:
              secretKeyRef:
                name: monog-secret
                key: mongo-password
         -  name: DB_URL
            valueFrom:
              configMapKeyRef:
                name: mongo-config
                key: mongo-url

---
apiVersion: v1
kind: Service
metadata: 
  name: webapp-service
  labels:
    app: my-webapp
    type: front
spec:
  selector:
    app: my-webapp
  type: NodePort
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
    nodePort: 30100
    

apiVersion: apps/v1
kind: Deployment
metadata:
  name: monog-deployment
  labels:
    app: my-mongo
    type: DB
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-mongo
  template:
    metadata: 
      name: monog-deployment
      labels:
        app: my-mongo
        labels: DB
    spec:
      containers:
      -  name: mongodb
         image: mongo:5.0
         ports:
         -  containerPort: 27017
         env:
         -  name: MONGO_INITDB_ROOT_USERNAME
            valueFrom:
              secretKeyRef:
                name: monog-secret
                key: mongo-user
         -  name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: monog-secret
                key: mongo-password
---
apiVersion: v1
kind: Service
metadata: 
  name: mongo-service
  labels:
    app: my-mongo
    type: DB
spec:
  selector:
    app: my-mongo
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
    
